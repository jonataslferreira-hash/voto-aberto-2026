<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voto Aberto 2026</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="dashboard mode-simple" data-gradient="neutral">
      <div class="dashboard__glow" aria-hidden="true"></div>

      <header class="topbar panel">
        <div class="brand">
          <p class="brand__eyebrow">PAINEL ELEITORAL EM TEMPO REAL</p>
          <h1>Voto Aberto 2026</h1>
        </div>

        <nav class="scope-nav" aria-label="Escopo principal">
          <button type="button" class="scope-nav__btn is-active" data-main-scope="brasil">Brasil</button>
          <button type="button" class="scope-nav__btn" data-main-scope="estados">Estados</button>
          <button type="button" class="scope-nav__btn" data-main-scope="exterior">Exterior</button>
        </nav>

        <div class="controls">
          <label>
            <span>Modo</span>
            <select id="modeSelect" aria-label="Modo do painel">
              <option value="simple">Simples</option>
              <option value="complete">Completo</option>
            </select>
          </label>

          <label>
            <span>Fonte</span>
            <select id="providerSelect" aria-label="Fonte de dados">
              <option value="auto">Automático (prioridade)</option>
              <option value="tse">TSE oficial</option>
              <option value="eleicoes-feed">Feed independente</option>
              <option value="placar-do-voto">Placar do Voto</option>
            </select>
          </label>

          <label id="stateFilterWrap" class="is-hidden">
            <span>Estado</span>
            <select id="stateSelect" aria-label="Selecionar estado"></select>
          </label>

          <label id="exteriorFilterWrap" class="is-hidden">
            <span>Local</span>
            <select id="exteriorSelect" aria-label="Selecionar país ou cidade">
              <option value="exterior-geral">Geral (ZZ)</option>
            </select>
          </label>

          <button id="settingsBtn" class="settings-btn" type="button" aria-label="Configurações" title="Configurações">⚙</button>
        </div>
      </header>

      <section class="hero panel" aria-live="polite">
        <aside class="portrait portrait--blue" aria-label="Retrato de Flávio Bolsonaro indisponível por licença">
          <div class="portrait__shape" aria-hidden="true"></div>
          <p>Retrato indisponível<br /><small>Licença verificável ausente no repositório</small></p>
        </aside>

        <div class="hero__center">
          <div class="hero__status" id="sourceMeta"></div>
          <div class="hero__totals" id="heroTotals"></div>
          <div class="hero__bar" id="heroBar" role="img" aria-label="Barra proporcional de votos"></div>
          <div class="hero__badges" id="heroBadges"></div>
        </div>

        <aside class="portrait portrait--red" aria-label="Retrato de Lula indisponível por licença">
          <div class="portrait__shape" aria-hidden="true"></div>
          <p>Retrato indisponível<br /><small>Licença verificável ausente no repositório</small></p>
        </aside>
      </section>

      <section class="cards">
        <article class="panel card" id="cardApuracao"></article>
        <article class="panel card" id="cardCandidatos"></article>
        <article class="panel card" id="cardDiferenca"></article>
        <article class="panel card" id="cardRegioes"></article>

        <article class="panel card mode-complete" id="cardMapa">
          <h2>Mapa por estado</h2>
          <div class="map-legend" id="mapLegend"></div>
          <svg id="brazilMap" viewBox="0 0 620 360" role="img" aria-label="Cartograma clicável dos estados"></svg>
        </article>

        <article class="panel card mode-complete" id="cardExterior">
          <div class="tabs" role="tablist" aria-label="Votos no exterior">
            <button type="button" class="tab is-active" data-exterior-tab="geral">Geral</button>
            <button type="button" class="tab" data-exterior-tab="pais">Por país</button>
            <button type="button" class="tab" data-exterior-tab="cidade">Por cidade</button>
          </div>
          <div id="exteriorContent"></div>
        </article>

        <article class="panel card mode-complete" id="cardUpdates"></article>

        <article class="panel card mode-complete" id="cardHistorico">
          <div class="card__header">
            <h2>Histórico de porcentagens</h2>
            <select id="windowSelect" aria-label="Janela do histórico">
              <option value="1h">1h</option>
              <option value="3h">3h</option>
              <option value="all">Total</option>
            </select>
          </div>
          <svg id="historyChart" viewBox="0 0 680 260" role="img" aria-label="Gráfico de linha com evolução das porcentagens"></svg>
        </article>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
